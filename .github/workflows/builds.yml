name: Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    name: "Build | Features: ${{ matrix.features }}"
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "validator"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Build (no features)
        if: matrix.features == ''
        run: |
          cargo build --no-default-features --verbose
      - name: "Build (features: ${{ matrix.features }})"
        if: matrix.features != ''
        run: |
          cargo build --no-default-features --features "${{ matrix.features }}" --verbose
